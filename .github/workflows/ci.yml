name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_call:

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
# workflow_call inherits the caller's ref (e.g. version tag from Publish).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
