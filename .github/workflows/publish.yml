name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  publish:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version v$TAG_VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: n8n community node lint
        run: npx @n8n/node-cli@latest lint

      - name: Publish to npm with provenance
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            echo "Pre-release $PACKAGE_VERSION -> publishing with dist-tag 'next'"
            npm publish --provenance --access public --tag next
          else
            echo "Stable $PACKAGE_VERSION -> publishing with dist-tag 'latest'"
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  post-publish-scan:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for npm registry dist-tag to match this version
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            TAG="next"
          else
            TAG="latest"
          fi
          echo "Expecting $PACKAGE_NAME@$PACKAGE_VERSION under dist-tag '$TAG'"
          for attempt in $(seq 1 30); do
            PUBLISHED_VERSION="$(npm view "$PACKAGE_NAME" "dist-tags.$TAG" 2>/dev/null || true)"
            if [ "$PUBLISHED_VERSION" = "$PACKAGE_VERSION" ]; then
              echo "$PACKAGE_NAME@$PACKAGE_VERSION is available as npm $TAG"
              exit 0
            fi
            echo "Waiting for npm $TAG to become $PACKAGE_NAME@$PACKAGE_VERSION (attempt $attempt/30, current: ${PUBLISHED_VERSION:-none})..."
            sleep 10
          done
          echo "npm $TAG did not become $PACKAGE_NAME@$PACKAGE_VERSION in time" >&2
          exit 1

      - name: n8n community package scan
        run: npx @n8n/scan-community-package@latest "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
