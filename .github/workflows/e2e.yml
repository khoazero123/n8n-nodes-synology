name: e2e

on:
  workflow_dispatch:
    inputs:
      n8n_version:
        description: n8n version to install for workflow E2E tests
        required: false
        default: latest
  workflow_call:
    inputs:
      n8n_version:
        description: n8n version to install for workflow E2E tests
        required: false
        type: string
        default: latest
    secrets:
      SYNO_PASS:
        required: true
      SYNO_ALLOW_UNAUTHORIZED_CERTS:
        required: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      N8N_VERSION: ${{ inputs.n8n_version || 'latest' }}
      SYNO_BASE_URL: ${{ vars.SYNO_BASE_URL }}
      SYNO_ACCOUNT: ${{ vars.SYNO_USERNAME }}
      SYNO_PASS: ${{ secrets.SYNO_PASS }}
      SYNO_ALLOW_UNAUTHORIZED_CERTS: ${{ secrets.SYNO_ALLOW_UNAUTHORIZED_CERTS || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify required Synology secrets
        run: |
          missing=0
          for name in SYNO_BASE_URL SYNO_ACCOUNT SYNO_PASS; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub variable or secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: n8n community node lint
        run: npx @n8n/node-cli@latest lint

      - name: Scanner-equivalent ESLint checks
        run: |
          SCANNER_DIR="$(mktemp -d)"
          npm install --prefix "$SCANNER_DIR" --no-save \
            eslint@9.29.0 \
            @typescript-eslint/parser@8.32.0 \
            @n8n/eslint-plugin-community-nodes@0.28.0 \
            eslint-plugin-n8n-nodes-base@1.16.3

          cat > "$SCANNER_DIR/eslint.config.mjs" <<'EOF'
          import { defineConfig } from 'eslint/config';

          export default defineConfig(
            (await import('@n8n/eslint-plugin-community-nodes')).n8nCommunityNodesPlugin.configs.recommended,
            { rules: { 'no-console': 'error' } },
            { plugins: { 'n8n-nodes-base': (await import('eslint-plugin-n8n-nodes-base')).default } },
            {
              files: ['package.json'],
              rules: { ...(await import('eslint-plugin-n8n-nodes-base')).default.configs.community.rules },
            },
            {
              files: ['**/credentials/**/*.ts'],
              rules: {
                ...(await import('eslint-plugin-n8n-nodes-base')).default.configs.credentials.rules,
                'n8n-nodes-base/cred-class-field-documentation-url-miscased': 'off',
                'n8n-nodes-base/cred-class-field-type-options-password-missing': 'off',
              },
            },
            {
              files: ['**/nodes/**/*.ts'],
              rules: {
                ...(await import('eslint-plugin-n8n-nodes-base')).default.configs.nodes.rules,
                'n8n-nodes-base/node-class-description-inputs-wrong-regular-node': 'off',
                'n8n-nodes-base/node-class-description-outputs-wrong': 'off',
                'n8n-nodes-base/node-param-type-options-max-value-present': 'off',
              },
            },
            {
              files: ['**/*.json'],
              languageOptions: { parser: (await import('@typescript-eslint/parser')).default },
            },
            {
              files: ['**/*.ts'],
              languageOptions: { parser: (await import('@typescript-eslint/parser')).default },
            },
          );
          EOF

          NODE_PATH="$SCANNER_DIR/node_modules" "$SCANNER_DIR/node_modules/.bin/eslint" \
            --config "$SCANNER_DIR/eslint.config.mjs" \
            package.json 'credentials/**/*.ts' 'nodes/**/*.ts' 'dist/**/*.js'

      - name: Package dry run
        run: npm pack --dry-run

      - name: Prepare Docker n8n custom node
        run: |
          rm -rf .e2e-n8n
          mkdir -p .e2e-n8n/custom/n8n-nodes-synology
          cp -a dist package.json index.js .e2e-n8n/custom/n8n-nodes-synology/
          chmod -R a+rwX .e2e-n8n

      - name: Start Docker n8n for expanded Note Station E2E
        run: |
          docker run -d --name n8n-synology-e2e \
            -p 5680:5678 \
            -e N8N_SECURE_COOKIE=false \
            -e N8N_RUNNERS_ENABLED=false \
            -v "$PWD/.e2e-n8n:/home/node/.n8n" \
            "n8nio/n8n:${N8N_VERSION}"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5680/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs n8n-synology-e2e
          exit 1

      - name: Direct Drive API E2E
        run: npm run test:e2e:drive:direct

      - name: Drive n8n Workflow E2E
        run: npm run test:e2e:drive:n8n
        env:
          N8N_BASE_URL: http://127.0.0.1:5680
          N8N_OWNER_EMAIL: synology-ci-e2e@example.com
          N8N_OWNER_PASSWORD: N8nCiE2e-ChangeMe-2026!

      - name: Note Station n8n Workflow E2E
        run: npm run test:e2e:n8n
        env:
          N8N_BASE_URL: http://127.0.0.1:5680
          N8N_OWNER_EMAIL: synology-ci-e2e@example.com
          N8N_OWNER_PASSWORD: N8nCiE2e-ChangeMe-2026!

      - name: Expanded Note Station n8n Workflow E2E
        run: npm run test:e2e:n8n:notestation:expanded
        env:
          N8N_BASE_URL: http://127.0.0.1:5680
          N8N_OWNER_EMAIL: synology-ci-e2e@example.com
          N8N_OWNER_PASSWORD: N8nCiE2e-ChangeMe-2026!

      - name: Synology Chat outgoing webhook CRUD E2E
        run: npm run test:e2e:chat:outgoing
        env:
          N8N_BASE_URL: http://127.0.0.1:5680
          N8N_OWNER_EMAIL: synology-ci-e2e@example.com
          N8N_OWNER_PASSWORD: N8nCiE2e-ChangeMe-2026!

      - name: Synology Chat trigger E2E
        run: npm run test:e2e:chat:trigger
        env:
          N8N_BASE_URL: http://127.0.0.1:5680
          N8N_OWNER_EMAIL: synology-ci-e2e@example.com
          N8N_OWNER_PASSWORD: N8nCiE2e-ChangeMe-2026!

      - name: Synology MailPlus trigger E2E
        run: npm run test:e2e:mail:trigger
        env:
          N8N_BASE_URL: http://127.0.0.1:5680
          N8N_OWNER_EMAIL: synology-ci-e2e@example.com
          N8N_OWNER_PASSWORD: N8nCiE2e-ChangeMe-2026!

      - name: Synology MailPlus trigger filters E2E
        run: npm run test:e2e:mail:filters
        env:
          N8N_BASE_URL: http://127.0.0.1:5680
          N8N_OWNER_EMAIL: synology-ci-e2e@example.com
          N8N_OWNER_PASSWORD: N8nCiE2e-ChangeMe-2026!

      # Optional until the target NAS Synology Drive dependency is healthy.
      - name: Note Station attachment binary n8n Workflow E2E
        if: vars.SYNO_NOTE_ATTACHMENT_E2E == 'true'
        run: npm run test:e2e:n8n:notestation:attachments
        env:
          N8N_BASE_URL: http://127.0.0.1:5680
          N8N_OWNER_EMAIL: synology-ci-e2e@example.com
          N8N_OWNER_PASSWORD: N8nCiE2e-ChangeMe-2026!

      - name: Download Station n8n Workflow E2E
        run: npm run test:e2e:ds:n8n
        env:
          N8N_BASE_URL: http://127.0.0.1:5680
          N8N_OWNER_EMAIL: synology-ci-e2e@example.com
          N8N_OWNER_PASSWORD: N8nCiE2e-ChangeMe-2026!

      - name: Stop Docker n8n
        if: always()
        run: docker rm -f n8n-synology-e2e || true

      # Docker container (root/node uid) creates files under .e2e-n8n that the
      # runner user cannot remove; clean with sudo so the next job's workspace
      # reset doesn't fail with EACCES.
      - name: Clean up E2E workspace (root-owned files)
        if: always()
        run: |
          sudo rm -rf .e2e-n8n
          sudo rm -rf /tmp/scan-local || true
